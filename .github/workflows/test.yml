name: Test PodcastLens

on: [push, pull_request]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: cfn-lint template.json
      - run: cfn-lint ../infrastructure/web.json
      - run: bash -n scripts/deploy.sh
      - run: python cli.py --help

  web-application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-web-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tests/test_dashboard.py
      - run: python tests/test_deployment.py
      - run: python legacy/tests/test_processor.py
      - run: node --check web/app.js
      - run: |
          for script in scripts/*.sh; do
            bash -n "$script" || exit 1
          done
